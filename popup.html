<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="page" id="pageMain">
      <div class="header">
        <h1>Airbnb Better Maps</h1>
        <label class="toggle" title="Enable / disable the whole extension">
          <input type="checkbox" id="masterEnabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="status" id="mapStatus" data-state="searching">
        <div class="row">
          <span class="dot"></span>
          <span class="text" id="mapStatusText">Looking for map…</span>
        </div>
        <div class="hint">
          Click the layer control on the top left of the map to start using the
          layers. Zoom in to reveal more tags.
        </div>
      </div>

      <div class="cache-row">
        <span class="label">
          <span>Cached data</span>
          <strong id="cacheSize">…</strong>
        </span>
        <button id="manageCache" type="button">Manage</button>
      </div>

      <div class="footer">
        <span class="row-line"
          >Transit lines from
          <a
            href="https://www.openstreetmap.org"
            target="_blank"
            rel="noopener noreferrer"
            >openstreetmap.org</a
          ></span
        >
        <span class="row-line"
          >Neighborhood zones from
          <a
            href="https://hoodmaps.com"
            target="_blank"
            rel="noopener noreferrer"
            >hoodmaps.com</a
          ></span
        >
      </div>
    </div>

    <div class="page" id="pageCache" hidden>
      <div class="page-head">
        <button class="back-btn" id="cacheBack" type="button" aria-label="Back">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <h1 class="page-title">Cached data</h1>
        <button class="clear-all" id="cacheClearAll" type="button" hidden>
          Clear all
        </button>
      </div>
      <ul class="cache-list" id="cacheList"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
