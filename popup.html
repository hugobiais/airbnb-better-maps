<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 220px; padding: 12px; margin: 0; }
      h1 { font-size: 13px; margin: 0 0 10px; }
      label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
      .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
      hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
      .hint { color: #666; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Airbnb Transit Overlay</h1>
    <label><input type="checkbox" id="enabled" /> Enable overlay</label>
    <hr />
    <label><input type="checkbox" data-mode="subway" /> <span class="swatch" style="background:#0066B3"></span> Subway / Metro</label>
    <label><input type="checkbox" data-mode="tram" /> <span class="swatch" style="background:#E60012"></span> Tram</label>
    <label><input type="checkbox" data-mode="light_rail" /> <span class="swatch" style="background:#8E44AD"></span> Light rail</label>
    <label><input type="checkbox" data-mode="train" /> <span class="swatch" style="background:#2E7D32"></span> Commuter rail</label>
    <p class="hint">Data: OpenStreetMap via Overpass. Reload Airbnb tabs after toggling.</p>
    <script src="popup.js"></script>
  </body>
</html>
